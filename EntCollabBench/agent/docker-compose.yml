services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  agent-it-service-desk-l1:
    build:
      context: ..
      dockerfile: agent/Dockerfile
      args:
        AGENT_NAME: "it_service_desk_l1"
    image: company-agent-team-it-service-desk-l1:latest
    pull_policy: never
    command:
      - "sh"
      - "-lc"
      - >
        mkdir -p /app/workspace &&
        if [ -d /app/local_data/it_service_desk_l1 ] && [ -z "$$(ls -A /app/workspace 2>/dev/null)" ]; then
          cp -a /app/local_data/it_service_desk_l1/. /app/workspace/ 2>/dev/null || true;
        fi &&
        exec python agent.py --agent-name it_service_desk_l1 --port 8001
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY is required}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      ALL_PROXY: "${ALL_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,redis}"
      http_proxy: "${http_proxy:-${HTTP_PROXY:-}}"
      https_proxy: "${https_proxy:-${HTTPS_PROXY:-}}"
      all_proxy: "${all_proxy:-${ALL_PROXY:-}}"
      AGENT_LLM_MODEL: "${AGENT_LLM_MODEL:?AGENT_LLM_MODEL is required}"
      AGENT_PEERS_FILE: "/app/config/agent_peers.json"
      AGENT_SPECS_FILE: "/app/config/agent_specs.json"
      MCP_ENDPOINTS_FILE: "/app/config/mcp_endpoints.json"
      AGENT_WORKSPACE_DIR: "/app/workspace"
      AGENT_DEBUG: "${AGENT_DEBUG:-0}"
      AGENT_DEBUG_MAX_CHARS: "${AGENT_DEBUG_MAX_CHARS:-500}"
      AGENT_SUMMARY_ENABLED: "${AGENT_SUMMARY_ENABLED:-1}"
      AGENT_SUMMARY_MODEL: "${AGENT_SUMMARY_MODEL:?AGENT_SUMMARY_MODEL is required}"
      AGENT_SUMMARY_TRIGGER_TOKENS: "${AGENT_SUMMARY_TRIGGER_TOKENS:-0}"
      AGENT_SUMMARY_TRIGGER_MESSAGES: "${AGENT_SUMMARY_TRIGGER_MESSAGES:-12}"
      AGENT_SUMMARY_KEEP_MESSAGES: "${AGENT_SUMMARY_KEEP_MESSAGES:-6}"
      AGENT_HTTP_TIMEOUT_SECONDS: "${AGENT_HTTP_TIMEOUT_SECONDS:-300}"
      MCP_SCHEMA_CONTEXT_MODE: "${MCP_SCHEMA_CONTEXT_MODE:-compact}"
      MCP_SCHEMA_MEMORY_REDACTION_MODE: "${MCP_SCHEMA_MEMORY_REDACTION_MODE:-placeholder}"
      AGENT_WORKSPACE_READ_MAX_CHARS: "${AGENT_WORKSPACE_READ_MAX_CHARS:-20000}"
      AGENT_WORKSPACE_READ_HEAD_LINES: "${AGENT_WORKSPACE_READ_HEAD_LINES:-200}"
      AGENT_WORKSPACE_READ_LARGE_FILE_BYTES: "${AGENT_WORKSPACE_READ_LARGE_FILE_BYTES:-1048576}"
      REDIS_URL: "redis://redis:6379/0"
      AGENT_SESSION_BINDINGS_PREFIX: "company-agent:session-bindings"
      AGENT_SESSION_BINDINGS_TTL_SECONDS: "86400"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../config:/app/config:ro
    ports:
      - "18001:8001"
    depends_on:
      - redis

